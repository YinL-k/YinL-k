  <circle cx="1030" cy="70" r="190" fill="#38bdf8" opacity=".09"/>
  <circle cx="1090" cy="290" r="210" fill="#2dd4bf" opacity=".08"/>
  <path d="M700 270C830 170 890 280 1010 170S1120 110 1200 65" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M730 310C860 210 920 320 1040 210S1150 150 1220 105" fill="none" stroke="url(#line)" stroke-opacity=".5" stroke-width="1.5"/>
  <g fill="#fff">
