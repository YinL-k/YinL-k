<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Xianzhuo Ari Yin — Engineering Profile</title>
  <desc id="desc">A dark blue gradient banner with the profile name and focus areas: platform engineering, payment systems, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset=".52" stop-color="#174a91"/>
      <stop offset="1" stop-color="#087e9b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78b7ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#78b7ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#dbeafe" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
