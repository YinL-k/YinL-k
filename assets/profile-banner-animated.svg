<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Xianzhuo (Ari) Yin — Co-Founder and CTO at YuanMil</title>
  <desc id="desc">A dark blue gradient banner identifying Xianzhuo (Ari) Yin as Co-Founder and CTO at YuanMil, focused on platform engineering, payment systems, and applied AI, studying Computer Science at Drew University with a Mathematics minor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset=".52" stop-color="#174a91"/>
      <stop offset="1" stop-color="#087e9b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78b7ff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#78b7ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".9"/>
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="lineFocusOne" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5">
        <animate attributeName="stdDeviation" from="5" to="0" dur="1.05s" begin="2.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
      </feGaussianBlur>
    </filter>
    <filter id="lineFocusTwo" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5">
        <animate attributeName="stdDeviation" from="5" to="0" dur="1.15s" begin="2.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
      </feGaussianBlur>
    </filter>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".19"/>
      <stop offset=".55" stop-color="#2dd4bf" stop-opacity=".075"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#dbeafe" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="#10182f"/>
  <rect width="1200" height="320" rx="22" fill="url(#bg)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".65s" begin="0s" fill="freeze"/>
  </rect>
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".8s" begin=".12s" fill="freeze"/>
  </rect>
  <circle cx="1030" cy="70" r="190" fill="url(#blueGlow)" opacity="0">
    <animate attributeName="opacity" from="0" to=".78" dur=".9s" begin="2.3s" fill="freeze"/>
    <animate begin="3.45s" attributeName="r" values="184;212;184" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
    <animate begin="3.45s" attributeName="opacity" values=".78;1;.78" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </circle>
  <circle cx="1090" cy="290" r="210" fill="url(#tealGlow)" opacity="0">
    <animate attributeName="opacity" from="0" to=".74" dur="1s" begin="2.9s" fill="freeze"/>
    <animate attributeName="r" values="198;230;198" dur="18s" begin="4.15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
    <animate attributeName="opacity" values=".74;.96;.74" dur="18s" begin="4.15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </circle>
  <path d="M700 270C830 170 890 280 1010 170S1120 110 1200 65" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round" opacity=".10" filter="url(#lineGlow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.05s" begin="2.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <animate begin="3.45s" attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1" values="M700 270C830 170 890 280 1010 170S1120 110 1200 65;M700 270C830 160 890 291 1010 177S1120 118 1200 70;M700 270C830 181 890 267 1010 163S1120 101 1200 59;M700 270C830 170 890 280 1010 170S1120 110 1200 65"/>
    <animate begin="3.45s" attributeName="opacity" values=".10;.16;.10" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </path>
  <path d="M700 270C830 170 890 280 1010 170S1120 110 1200 65" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity=".82" filter="url(#lineFocusOne)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.05s" begin="2.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <animate begin="3.45s" attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1" values="M700 270C830 170 890 280 1010 170S1120 110 1200 65;M700 270C830 160 890 291 1010 177S1120 118 1200 70;M700 270C830 181 890 267 1010 163S1120 101 1200 59;M700 270C830 170 890 280 1010 170S1120 110 1200 65"/>
    <animate begin="3.45s" attributeName="stroke-opacity" values=".68;.98;.68" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </path>
  <path d="M730 310C860 210 920 320 1040 210S1150 150 1220 105" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity=".08" filter="url(#lineGlow)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.15s" begin="2.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <animate attributeName="d" begin="4.15s" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1" values="M730 310C860 210 920 320 1040 210S1150 150 1220 105;M730 310C860 201 920 331 1040 217S1150 159 1220 111;M730 310C860 219 920 309 1040 203S1150 141 1220 99;M730 310C860 210 920 320 1040 210S1150 150 1220 105"/>
    <animate attributeName="opacity" values=".08;.14;.08" dur="18s" begin="4.15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </path>
  <path d="M730 310C860 210 920 320 1040 210S1150 150 1220 105" fill="none" stroke="url(#line)" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round" filter="url(#lineFocusTwo)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.15s" begin="2.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <animate attributeName="d" begin="4.15s" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1" values="M730 310C860 210 920 320 1040 210S1150 150 1220 105;M730 310C860 201 920 331 1040 217S1150 159 1220 111;M730 310C860 219 920 309 1040 203S1150 141 1220 99;M730 310C860 210 920 320 1040 210S1150 150 1220 105"/>
    <animate attributeName="stroke-opacity" values=".5;.72;.5" dur="18s" begin="4.15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
  </path>
  <g fill="#fff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".28s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-18 0" to="0 0" begin=".28s" dur=".62s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <text x="76" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="750" letter-spacing="-.8">Xianzhuo (Ari) Yin</text>
  </g>
  <g fill="#fff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".48s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" begin=".48s" dur=".62s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <text x="79" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing=".1" fill="#ffffff">CO-FOUNDER &amp; CTO @ YUANMIL</text>
  </g>
  <g fill="#c5d8f2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".68s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin=".68s" dur=".62s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <text x="80" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">PLATFORM ENGINEERING · PAYMENT SYSTEMS · APPLIED AI</text>
  </g>
  <g transform="translate(80 258)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#dbeafe" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".92s" dur=".55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" from="0 8" to="0 0" begin=".92s" dur=".65s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <text x="0" y="0">DREW UNIVERSITY</text>
    <circle cx="145" cy="-4" r="2.5" fill="#5eead4"/>
    <text x="160" y="0">COMPUTER SCIENCE</text>
    <circle cx="300" cy="-4" r="2.5" fill="#5eead4"/>
    <text x="315" y="0">MATHEMATICS MINOR</text>
  </g>

</svg>