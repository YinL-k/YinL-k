<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Xianzhuo (Ari) Yin — Co-Founder and CTO at YuanMil</title>
  <desc id="desc">A dark blue gradient banner identifying Xianzhuo (Ari) Yin as Co-Founder and CTO at YuanMil, focused on platform engineering, payment systems, and applied AI, studying Computer Science at Drew University with a Mathematics minor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset=".52" stop-color="#174a91"/>
      <stop offset="1" stop-color="#087e9b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78b7ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#78b7ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".9"/>
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
